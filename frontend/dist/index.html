<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf6df"><title>慢慢来 · 你的生活陪做搭子</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='22' fill='%23ffda63'/%3E%3Ctext y='47' x='9' font-size='43'%3E✿%3C/text%3E%3C/svg%3E"><style>
:root{--ink:#494638;--muted:#96917e;--yellow:#f8d65b;--bg:#fcf9ed}*{box-sizing:border-box}body{margin:0;background:#ecebe5;color:var(--ink);font-family:'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}button,textarea,input{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit;min-height:42px;transition:background .2s,transform .15s}button:active{transform:scale(.96)}button:focus-visible,textarea:focus-visible{outline:2px solid #ac8831;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.app{width:100%;max-width:440px;height:100dvh;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}.top{height:71px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:14px 22px 8px;background:#fbf6df;z-index:2}.brand{font-size:19px;font-weight:750;display:flex;gap:9px;align-items:center}.brand span{font-size:27px;color:#b18c28}.menu{display:flex;border:1px solid #dcd6bf;border-radius:24px;height:32px;align-items:center;background:#ffffff61}.menu button{min-height:30px;width:43px;display:grid;place-items:center}.menu i{height:15px;width:1px;background:#d4cfbd}.menu svg{width:19px;height:19px}.scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;background:radial-gradient(ellipse at 50% 8%,#fbefbc66,transparent 49%)}.welcome{padding:28px 25px 10px;text-align:center}.mascot{position:relative;width:158px;height:135px;margin:5px auto 12px}.mascot svg{width:100%;height:100%;overflow:visible}.spark{position:absolute;color:#b5a46a;font-size:22px}.spark.one{left:-13px;top:32px;transform:rotate(-15deg)}.spark.two{right:-14px;top:68px;font-size:14px}.hello{font-size:12px;color:#a49a73;letter-spacing:2px;margin-bottom:10px}.welcome h1{font-size:27px;line-height:1.45;letter-spacing:.3px;margin:0 0 12px;font-weight:750}.underline{background:linear-gradient(transparent 69%,#f8dc7b90 69%)}.welcome p{font-size:13px;line-height:1.9;color:#9b937d;margin:0}.suggestions{padding:25px 24px 16px}.suggest-head{display:flex;align-items:center;justify-content:space-between;color:#9a927b;font-size:11px;margin-bottom:10px}.suggest-head button{font-size:11px;min-height:30px;color:#a2956f}.query{display:flex;align-items:center;text-align:left;width:100%;background:#ffffffc9;border:1px solid #efead8;border-radius:17px;padding:13px 14px;margin-bottom:9px;gap:12px;box-shadow:0 3px 7px #64572202}.query:hover{background:#fff}.query .emoji{display:grid;place-items:center;width:35px;height:35px;background:#f8f2de;border-radius:12px;font-size:20px;flex-shrink:0}.query .text{flex:1;font-size:13px;line-height:1.65}.query .arrow{color:#b5ac91;font-size:18px}.little-note{text-align:center;font-size:10px;color:#b2a88f;margin:7px 0 18px;letter-spacing:1px}.bottom{flex-shrink:0;background:linear-gradient(#fcf9eddd,#fcf9ed 18%);padding:8px 18px calc(12px + env(safe-area-inset-bottom));}.attachment{display:flex;align-items:center;gap:8px;background:#f3ebce;border-radius:12px;padding:5px 11px;margin-bottom:8px;font-size:12px}.attachment span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attachment[hidden]{display:none}.attachment button{min-height:28px}.composer{background:white;border-radius:23px;padding:13px 13px 10px;box-shadow:0 4px 24px #88702c09;border:1px solid #eae2c9}.composer textarea{display:block;width:100%;resize:none;min-height:36px;max-height:95px;border:0;background:none;outline:none;padding:3px 4px;color:var(--ink);font-size:14px;line-height:1.7}.composer textarea::placeholder{color:#b4ae9b}.composer-tools{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.tool-group{display:flex;gap:5px}.tool{min-height:34px;background:#f8f6ee;border-radius:12px;padding:5px 10px;font-size:11px;display:flex;align-items:center;gap:5px}.tool svg{width:16px;height:16px}.send{background:var(--yellow);border-radius:50%;width:36px;min-height:36px;font-size:21px;display:grid;place-items:center}.bottom-note{text-align:center;font-size:9px;color:#b5ad99;margin-top:10px}.messages{padding:18px 21px 24px;display:flex;flex-direction:column;gap:20px}.messages:empty{display:none}.message{max-width:92%;font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#f5df91;padding:12px 16px;border-radius:19px 19px 5px 19px}.assistant-wrap{display:flex;gap:9px;align-items:flex-start}.mini{width:29px;height:29px;flex-shrink:0;background:#f8da72;border-radius:11px;display:grid;place-items:center;font-size:18px}.assistant{background:#fffdf7;padding:12px 15px;border:1px solid #eee8d5;border-radius:3px 17px 17px 17px}.message video{display:block;width:100%;max-height:210px;border-radius:10px;margin-top:8px}.chat-caption{text-align:center;font-size:11px;color:#aba087;padding:15px 0 0}.chat-caption[hidden]{display:none}dialog{border:0;border-radius:24px;padding:26px;width:calc(100% - 38px);max-width:396px;color:var(--ink);background:#fffdf6;box-shadow:0 20px 80px #30280b20}dialog.video-modal{max-width:660px}dialog::backdrop{background:#39332155;backdrop-filter:blur(3px)}dialog h2{font-size:20px;margin:0 32px 13px 0}dialog p{font-size:13px;color:#9a927d;line-height:1.8}.close{position:absolute;right:12px;top:9px;font-size:22px}.primary{background:var(--yellow);width:100%;border-radius:14px;padding:12px;margin-top:13px;font-weight:600}.video-preview{position:relative;width:100%;aspect-ratio:16/9;border-radius:15px;overflow:hidden;background:#24231f}.video-preview iframe{display:block;width:100%;height:100%;border:0}.breakdown-button{position:absolute;right:12px;bottom:12px;z-index:2;min-height:38px;padding:8px 15px;border-radius:19px;background:var(--yellow);font-size:12px;font-weight:700;box-shadow:0 4px 18px #0005}.breakdown-button:disabled{background:#e5dcc2}dialog input[type=url]{width:100%;padding:13px;border:1px solid #e4dcc5;border-radius:12px;margin-top:8px;background:white}.upload-option{display:flex;align-items:center;gap:12px;padding:17px;border-radius:14px;background:#f5f0dd;cursor:pointer;margin-top:17px;font-size:14px}.upload-option input{width:100%;font-size:12px;margin-top:10px}.toast{position:absolute;bottom:170px;left:25px;right:25px;text-align:center;border-radius:12px;background:#4f493e;color:white;padding:12px;font-size:12px;z-index:10}.history-item{width:100%;background:#f4efdd;padding:12px;border-radius:12px;text-align:left;margin-top:10px}.privacy{font-size:11px!important}.desktop-caption{display:none}@media(min-width:600px){body{padding:24px 0}.app{height:calc(100dvh - 48px);max-height:900px;border-radius:32px;border:1px solid #ded9ca;box-shadow:0 15px 70px #59534414}.desktop-caption{display:block;position:fixed;left:calc(50% + 250px);bottom:40px;color:#9e9888;font-size:11px;line-height:1.9}}@media(max-height:740px){.welcome{padding-top:10px}.mascot{height:99px;width:120px;margin-bottom:8px}.welcome h1{font-size:24px}.suggestions{padding-top:16px}.query{padding:10px 13px}.welcome p{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.result-card{width:calc(100% - 38px);max-width:none;white-space:normal}.result-card>strong{font-size:15px}.result-card p{font-size:13px;color:#8d846d;margin:9px 0;line-height:1.8}.result-note{font-size:10px;color:#a5956b;background:#f6efd6;padding:8px 10px;border-radius:9px;margin:10px 0;line-height:1.7}.category{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:13px;margin:10px 0;background:#f8f3e4;border:1px solid #ece3cb;border-radius:14px}.category strong{font-size:13px}.category span{font-size:12px;color:#8c826a;line-height:1.7}.category small{font-size:11px;color:#a4842f}.video-choice{position:relative;padding-left:56px}.video-choice img{position:absolute;left:10px;top:10px;width:36px;height:36px;border-radius:8px;object-fit:cover;background:#eee8d9}</style></head><body><div class="app"><header class="top"><div class="brand"><span>✿</span>慢慢来</div><div class="menu"><button aria-label="更多选项" onclick="openMenu()"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button><i></i><button aria-label="回到首页" onclick="home()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg></button></div></header>
<div class="scroll" id="scroll"><section id="welcome"><div class="welcome"><div class="mascot"><span class="spark one">✧</span><span class="spark two">✦</span><svg viewBox="0 0 170 145" role="img" aria-label="抱着小纸心的黄色小慢"><ellipse cx="85" cy="133" rx="49" ry="6" fill="#e8dfbc" opacity=".55"/><path d="M41 76C22 67 21 47 37 41C34 22 54 14 68 27C80 7 103 12 108 29C130 18 147 36 138 52C161 62 153 85 136 88C137 115 117 130 86 130C53 130 32 114 41 76Z" fill="#f6d463"/><path d="M50 114Q39 137 58 134M114 116Q132 138 113 134" fill="#f6d463" stroke="#f6d463" stroke-width="8" stroke-linecap="round"/><ellipse cx="66" cy="65" rx="3" ry="4" fill="#645635"/><ellipse cx="106" cy="65" rx="3" ry="4" fill="#645635"/><path d="M79 73Q86 81 93 73" fill="none" stroke="#645635" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="53" cy="76" rx="8" ry="4" fill="#eaaa71" opacity=".6"/><ellipse cx="118" cy="76" rx="8" ry="4" fill="#eaaa71" opacity=".6"/><path d="M65 95Q63 78 77 85L86 94L96 85Q110 80 108 96L86 116Z" fill="#fff9e5"/><path d="M48 98Q62 92 68 103M122 98Q108 92 105 103" fill="none" stroke="#dab342" stroke-width="3" stroke-linecap="round"/></svg></div><div class="hello">嗨，我是你的小慢</div><h1>今天想一起<span class="underline">学点什么？</span></h1><p>把想做的事、看不懂的教程发给我<br>我们按你的节奏，慢慢来。</p></div><div class="suggestions"><div class="suggest-head"><span>也可以这样问</span><button onclick="swapQueries()">换一换 ↻</button></div><div id="queries"></div></div><div class="little-note">一小步，也是一点小小的进步 ♡</div></section><div class="chat-caption" id="chatCaption" hidden>小慢陪着你 · 按自己的节奏就好</div><div class="messages" id="messages" aria-live="polite"></div></div>
<footer class="bottom"><div class="attachment" id="attachment" hidden><span id="attachmentName"></span><button aria-label="移除视频" onclick="removeFile()">×</button></div><form class="composer" id="form"><textarea id="input" rows="1" aria-label="和小慢说说你想做什么" placeholder="想学什么，或者在哪一步卡住了？"></textarea><div class="composer-tools"><div class="tool-group"><button type="button" class="tool" onclick="openUpload()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 9 5-3v12l-5-3Z"/></svg>上传视频</button><button type="button" class="tool" onclick="openLink()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m10 7 3-3a5 5 0 0 1 7 7l-3 3M14 17l-3 3a5 5 0 0 1-7-7l3-3M8 16l8-8"/></svg>粘贴链接</button></div><button type="submit" id="send" class="send" aria-label="发送消息" disabled>↑</button></div></form><div class="bottom-note">AI 文字陪做 · YouTube 实时检索 · 尚未接入视频解析</div></footer><div class="toast" id="toast" role="status" hidden></div></div><div class="desktop-caption">慢慢来 / MOBILE DEMO<br>手机 App · 小程序交互预览</div><dialog id="modal"><button class="close" aria-label="关闭" onclick="closeModal()">×</button><div id="modalBody"></div></dialog>
<script>
const $=id=>document.getElementById(id);let chatHistory=[],requestBusy=false;let queryPage=0,pendingFile=null,fileURLs=[],lastPrompt='',toastTimer;const queries=[[['🪴','第一次给绿植换盆，要准备些什么？'],['🧵','衣服纽扣掉了，能陪我一起缝好吗？'],['🎬','这个教程太快了，帮我按步骤慢慢做']],[['🧺','白色衣服沾了污渍，我该从哪一步开始？'],['🎨','想画一张生日贺卡，但我完全没有基础'],['🧶','钩针教程看不懂，可以一步步陪我吗？']]];
function drawQueries(){$('queries').replaceChildren(...queries[queryPage].slice(0,1).map(([emoji,text])=>{const b=document.createElement('button');b.className='query';const icon=document.createElement('span');icon.className='emoji';icon.textContent=emoji;const t=document.createElement('span');t.className='text';t.textContent=text;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';b.append(icon,t,arrow);b.onclick=()=>{$('input').value=text;updateInput();send()};return b}))}function swapQueries(){queryPage=1-queryPage;drawQueries()}function updateInput(){$('send').disabled=requestBusy||(!$('input').value.trim()&&!pendingFile);$('input').style.height='auto';$('input').style.height=Math.min($('input').scrollHeight,95)+'px'}$('input').addEventListener('input',updateInput);$('form').addEventListener('submit',e=>{e.preventDefault();send()});$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
function addMessage(text,role,file){const bubble=document.createElement('div');bubble.className='message '+role;bubble.textContent=text;if(file){const video=document.createElement('video');const url=URL.createObjectURL(file);fileURLs.push(url);video.src=url;video.controls=true;video.playsInline=true;video.setAttribute('aria-label','已选择的视频预览');bubble.append(video)}if(role==='assistant'){const wrap=document.createElement('div');wrap.className='assistant-wrap';const face=document.createElement('div');face.className='mini';face.textContent='✿';wrap.append(face,bubble);$('messages').append(wrap)}else $('messages').append(bubble)}
async function send(){if(requestBusy)return;const text=$('input').value.trim();if(!text&&!pendingFile)return;$('welcome').hidden=true;$('chatCaption').hidden=false;lastPrompt=text||'我想跟着这个视频学一学';addMessage(text||'帮我看看这个教程吧','user',pendingFile);const hasFile=!!pendingFile;removeFile();$('input').value='';updateInput();if(hasFile)addMessage('视频已加入对话，可以在这里播放。真实视频解析接口尚未配置，暂时不会根据视频生成步骤。','assistant');else if(/https?:\/\//i.test(text))addMessage('链接已收到。当前不会读取或解析链接中的视频。','assistant');else await askAgent(text);bottomScroll()}
async function askAgent(text){requestBusy=true;updateInput();const pending=assistantCard();pending.textContent='小慢正在回答并检索 YouTube…';pending.setAttribute('role','status');bottomScroll();const next=[...chatHistory,{role:'user',content:text}];try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:next})});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');chatHistory=[...next,{role:'assistant',content:result.message}];pending.replaceChildren();const textNode=el('div',result.message);textNode.style.whiteSpace='pre-wrap';pending.append(textNode);for(const option of result.options||[]){const b=el('button',option,'category');b.onclick=()=>{if(requestBusy)return;$('input').value=option;send()};pending.append(b)}appendYoutubeResults(pending,result)}catch(error){pending.textContent='暂时没能完成回答：'+error.message;const retry=el('button','重新尝试','primary');retry.onclick=()=>{if(requestBusy)return;pending.parentElement.remove();askAgent(text)};pending.append(retry)}finally{requestBusy=false;updateInput();bottomScroll()}}
function bottomScroll(){$('scroll').scrollTop=$('scroll').scrollHeight}
function assistantCard(){const wrap=document.createElement('div');wrap.className='assistant-wrap';const face=document.createElement('div');face.className='mini';face.textContent='✿';const card=document.createElement('div');card.className='assistant message result-card';wrap.append(face,card);$('messages').append(wrap);return card}
function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function formatDuration(seconds){if(!seconds)return '';const total=Math.round(seconds);return Math.floor(total/60)+':'+String(total%60).padStart(2,'0')}
function appendYoutubeResults(card,result){const search=result.video_search;if(!search||!search.attempted)return;if(search.error){card.append(el('div',search.error+'，AI 文字回答仍可正常使用。','result-note'));return}if(!result.videos?.length){card.append(el('div','YouTube 实时检索没有找到相关教程。','result-note'));return}card.append(el('div','YouTube 实时检索 · 点击可在当前页预览原视频','result-note'));result.videos.forEach(video=>{const button=el('button','','category video-choice');if(video.thumbnail_url){const image=document.createElement('img');image.src=video.thumbnail_url;image.alt='';image.loading='lazy';image.referrerPolicy='no-referrer';button.append(image)}button.append(el('strong',video.title),el('span',[video.uploader,formatDuration(video.duration_seconds)].filter(Boolean).join(' · ')),el('small','预览 YouTube 原视频 →'));button.onclick=()=>previewYoutubeVideo(video);card.append(button)})}
async function readJson(response){const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw Error(response.status===404?'下载接口不存在，请重启前端服务':'服务返回了无法识别的响应')}if(!response.ok){const detail=typeof data.detail==='string'?data.detail:Array.isArray(data.detail)?data.detail.map(item=>item.msg).filter(Boolean).join('；'):data.error;throw Error(detail||'请求失败')}return data}
function previewYoutubeVideo(video){$('modal').classList.add('video-modal');showModal('<h2></h2>');const body=$('modalBody');body.querySelector('h2').textContent=video.title;const preview=el('div','','video-preview');const frame=document.createElement('iframe');frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(video.platform_video_id)+'?rel=0';frame.title=video.title+' · YouTube 原视频';frame.allow='fullscreen; picture-in-picture; encrypted-media; autoplay';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';const action=el('button','教程分解','breakdown-button');action.onclick=()=>startBreakdown(video,action);preview.append(frame,action);body.append(preview,el('p','当前播放的是 YouTube 原视频，尚未读取或解析视频内容。点击“教程分解”后才会开始下载。','privacy'));const link=el('a','无法播放？打开 YouTube 原视频 ↗');link.href=video.url;link.target='_blank';link.rel='noopener noreferrer';body.append(link)}
async function startBreakdown(video,button){if(button.disabled)return;button.disabled=true;button.textContent='正在创建任务…';try{const response=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:video.url,source_platform:'youtube',source_video_id:video.platform_video_id,title:video.title,uploader:video.uploader,thumbnail_url:video.thumbnail_url,duration_seconds:video.duration_seconds})});const task=await readJson(response);location.assign('/vedio.html?id='+encodeURIComponent(task.id))}catch(error){button.disabled=false;button.textContent='教程分解';notify(error.message)}}

function showModal(html){$('modalBody').innerHTML=html;if(!$('modal').open)$('modal').showModal()}function closeModal(){$('modal').close();$('modal').classList.remove('video-modal');$('modalBody').replaceChildren()}$('modal').addEventListener('close',()=>{if(!$('modal').open){$('modal').classList.remove('video-modal');$('modalBody').replaceChildren()}});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function openUpload(){showModal('<h2>把教程带过来吧</h2><p>选择相册或文件里的视频，放进对话一起看。</p><label class="upload-option"><div>↥ 选择本地视频<input type="file" accept="video/*" onchange="chooseFile(this)"></div></label><p class="privacy">文件只在当前浏览器中预览，不会上传服务器。暂不支持自动拆解。</p>')}function chooseFile(el){const f=el.files[0];if(!f)return;if(!f.type.startsWith('video/')){notify('请选择一个视频文件');return}pendingFile=f;$('attachment').hidden=false;$('attachmentName').textContent='▹ '+f.name;updateInput();closeModal();$('input').focus()}function removeFile(){pendingFile=null;$('attachment').hidden=true;updateInput()}function openLink(){showModal('<h2>分享你想跟做的教程</h2><p>粘贴小红书、TikTok 或其他教程链接。</p><input id="link" type="url" placeholder="https://…" aria-label="教程链接"><button class="primary" onclick="attachLink()">放入聊天框</button><p class="privacy">当前只展示链接输入流程，尚未接入平台内容解析。</p>')}function attachLink(){const input=$('link');if(!input.value.trim()){input.focus();return}if(!input.checkValidity()||!/^https?:\/\//i.test(input.value)){notify('请输入以 https:// 或 http:// 开头的完整链接');return}$('input').value=input.value.trim();updateInput();closeModal();$('input').focus()}
function openMenu(){showModal('<h2>留一点时间，慢慢学</h2><button class="history-item" onclick="newChat()">＋ 开始新对话</button><button class="history-item" onclick="home();closeModal()">⌂ 回到聊天首页</button><p class="privacy">当前是手机 App / 小程序的网页交互原型。聊天仅保留在当前页面，刷新后清空。</p>')}function home(){$('welcome').hidden=false;$('chatCaption').hidden=!$('messages').children.length;$('scroll').scrollTop=0}function newChat(){if(requestBusy){notify('请等当前回答完成后再开始新对话');return}chatHistory=[];$('messages').replaceChildren();fileURLs.forEach(URL.revokeObjectURL);fileURLs=[];removeFile();$('input').value='';updateInput();home();closeModal()}drawQueries();
</script></body></html>
