<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f9eee7">
  <title>素材库 · 慢慢来</title>
  <script src="/i18n.js"></script>
  <style>
    :root{--ink:#494638;--muted:#96917e;--paper:#fffdf7;--pink:#fbf6df;--yellow:#f8d65b;--line:#ded9ca;--accent:#a4842f}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#ecebe5;color:var(--ink);font-family:'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}.page{position:relative;isolation:isolate;width:100%;max-width:440px;min-height:100dvh;margin:auto;padding:20px clamp(18px,5vw,24px) 54px;overflow:hidden;background:var(--bg,#fcf9ed);background-image:radial-gradient(ellipse at 50% 8%,#fbefbc66,transparent 49%)}.page:before{content:'✧　　♡　　　　✦　　♡\A　　　♡　　　　✧　　　　♡\A ✦　　　　　♡　　　✧';white-space:pre;position:absolute;z-index:-1;inset:86px -20px auto;color:#b5a46a44;font-size:34px;line-height:5.8;letter-spacing:18px;transform:rotate(-4deg);pointer-events:none}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:28px}.top-actions{display:flex;align-items:center;gap:8px}.back{display:flex;align-items:center;gap:7px;color:var(--ink);text-decoration:none;border:1px solid #dcd6bf;border-radius:22px;padding:9px 14px;background:#ffffff61;font-size:13px;white-space:nowrap}.brand{font-size:14px;letter-spacing:2px;color:#b18c28;white-space:nowrap}.lang-switch{display:flex;align-items:center;border:1px solid #dcd6bf;border-radius:20px;height:32px;background:#ffffff61;overflow:hidden;flex:0 0 auto}.lang-switch button{min-height:30px;border:0;background:transparent;padding:0 9px;font-size:11px;color:var(--muted)}.lang-switch button.on{background:var(--yellow);color:var(--ink);font-weight:650}.hero{margin:0 2px 24px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);margin:0 0 8px}.hero h1{font-family:'STKaiti','KaiTi',serif;font-size:clamp(31px,8vw,46px);font-weight:500;margin:0}.hero p{font-size:12px;line-height:1.8;color:var(--muted);margin:9px 0 0}.search{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);margin:0 5px 20px;padding:0 4px 8px}.search span{font-size:25px}.search input{width:100%;border:0;outline:0;background:transparent;font-family:'STKaiti','KaiTi',serif;font-size:22px}.search input::placeholder{color:#b4ae9b}.filters{display:flex;gap:8px;overflow-x:auto;padding:0 2px 16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #dcd6bf;background:#fffdf7;border-radius:22px;padding:9px 14px;min-height:40px}.filter.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}.summary{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 18px;font-size:12px;color:var(--muted)}.summary strong{color:var(--accent);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}.card{border:0;background:transparent;padding:0;min-width:0;text-align:center;cursor:pointer}.art{position:relative;display:grid;place-items:center;aspect-ratio:1/1;margin-bottom:9px;border-radius:26px;background:#fffdf7cc;border:1px solid #eee8d5;box-shadow:0 12px 30px #6457220b;overflow:hidden}.art:after{content:'';position:absolute;inset:8px;border:1px dashed #dcd6bf80;border-radius:21px}.art img{position:relative;z-index:1;width:88%;height:88%;object-fit:contain;transition:transform .2s}.card:hover .art img{transform:rotate(-2deg) scale(1.035)}.card:focus-visible{outline:2px solid #ac8831;outline-offset:6px;border-radius:20px}.title{display:block;font-family:'STKaiti','KaiTi',serif;font-size:18px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{display:block;margin-top:4px;color:var(--muted);font-size:10.5px;line-height:1.5}.progress{display:block;color:var(--accent);font-size:10.5px;margin-top:3px}.empty{margin:40px 0;text-align:center;padding:34px 20px;border:1px dashed #dcd6bf;border-radius:24px;background:#fffdf7b8}.empty strong{display:block;font-family:'STKaiti','KaiTi',serif;font-size:23px;margin-bottom:8px}.empty p{color:var(--muted);font-size:12px;line-height:1.8}.empty a{display:inline-block;margin-top:8px;background:var(--yellow);color:var(--ink);text-decoration:none;border-radius:18px;padding:10px 16px;font-size:12px}.error{color:#9b4b3e}.loading{display:grid;place-items:center;min-height:260px;color:var(--muted);font-size:13px}.loading:before{content:'✿';font-size:32px;color:#b18c28;margin-right:10px}@media(max-width:360px){.brand{display:none}}@media(min-width:600px){body{padding:24px 0}.page{min-height:calc(100dvh - 48px);border-radius:30px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="page compact-page">
    <header class="top"><a class="back" href="/" data-i18n="library.back">← 回到聊天</a><div class="top-actions"><div class="lang-switch" role="group" aria-label="切换语言" data-i18n-aria="common.lang_aria"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div><div class="brand"><span data-i18n="common.brand">慢慢来</span> ✿</div></div></header>
    <section class="hero">
      <p class="eyebrow" data-i18n="library.eyebrow">教程素材库</p>
      <h1 data-i18n="library.heading">我的素材库</h1>
    </section>
    <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜教程名…" aria-label="搜索素材" data-i18n-ph="library.search_ph" data-i18n-aria="library.search_aria"></label>
    <nav class="filters" aria-label="素材分类" data-i18n-aria="library.filters_aria">
      <button class="filter on" data-category="all" data-i18n="library.category.all">全部</button>
      <button class="filter" data-category="cooking" data-i18n="library.category.cooking">做饭教程</button>
      <button class="filter" data-category="tools" data-i18n="library.category.tools">日常工具</button>
      <button class="filter" data-category="other" data-i18n="library.category.other">其他教程</button>
    </nav>
    <div class="summary"><strong id="filterName">全部素材</strong><span id="count"></span></div>
    <div class="loading" id="loading" data-i18n="library.loading">正在整理素材…</div>
    <section class="grid" id="grid" aria-live="polite"></section>
    <section class="empty" id="empty" hidden><strong id="emptyTitle">还没有拆好的素材</strong><p id="emptyText">从聊天页找一条教程，完成下载和真实画面分解后，它就会出现在这里。</p><a href="/" data-i18n="library.empty_action">去找一个教程 →</a></section>
  </main>
  <script>
    const state={items:[],category:'all',query:''};
    const labelKeys={all:'library.category.all_long',cooking:'library.category.cooking',tools:'library.category.tools',other:'library.category.other'};
    const icons={cooking:'/assets/library/cooking.png',tools:'/assets/library/tools.png',other:'/assets/library/other.png'};
    const $=id=>document.getElementById(id);
    function iconFor(item){if(/辣子鸡/.test(item.title))return '/assets/library/spicy-chicken.png';if(/洗衣机/.test(item.title))return '/assets/library/washing-machine.png';return icons[item.icon]||icons.other}
    function formatDuration(seconds){if(!seconds&&seconds!==0)return '';const total=Math.max(0,Math.round(seconds));return Math.floor(total/60)+':'+String(total%60).padStart(2,'0')}
    function progressText(item){if(item.step_done>=item.step_total)return I18N.t('library.progress_done',{n:item.step_total});if(item.step_done)return I18N.t('library.progress_mid',{done:item.step_done,total:item.step_total});return I18N.t('library.progress_start',{n:item.step_total})}
    function visibleItems(){const query=state.query.toLocaleLowerCase('zh-CN');return state.items.filter(item=>(state.category==='all'||item.category===state.category)&&(!query||(item.title+' '+(item.uploader||'')+' '+item.category_label).toLocaleLowerCase('zh-CN').includes(query)))}
    function render(){const items=visibleItems();$('filterName').textContent=I18N.t(labelKeys[state.category]);$('count').textContent=I18N.t('library.count',{n:items.length});$('grid').replaceChildren(...items.map(item=>{const card=document.createElement('button');card.className='card';card.type='button';card.setAttribute('aria-label',item.display_title+'，'+progressText(item));const art=document.createElement('span');art.className='art';const image=document.createElement('img');image.src=iconFor(item);image.alt='';image.loading='lazy';art.append(image);const title=document.createElement('strong');title.className='title';title.textContent=item.display_title;const meta=document.createElement('span');meta.className='meta';const basis=I18N.t(item.category_basis==='model'?'library.basis_model':'library.basis_keyword');meta.textContent=[I18N.t(labelKeys[item.category]||'library.category.other'),basis,formatDuration(item.duration_seconds)].filter(Boolean).join(' · ');const progress=document.createElement('span');progress.className='progress';progress.textContent=progressText(item);card.append(art,title,meta,progress);card.onclick=()=>location.assign('/steps.html?id='+encodeURIComponent(item.id));return card}));$('empty').hidden=items.length>0;if(!items.length){$('emptyTitle').textContent=I18N.t(state.items.length?'library.empty_filtered_title':'library.empty_title');$('emptyText').textContent=I18N.t(state.items.length?'library.empty_filtered_text':'library.empty_text')}}
    document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{state.category=button.dataset.category;document.querySelectorAll('.filter').forEach(item=>item.classList.toggle('on',item===button));render()}));
    $('search').addEventListener('input',event=>{state.query=event.target.value.trim();render()});
    I18N.apply();I18N.bootLanguageSwitch();document.title=I18N.t('library.title');render();
    document.addEventListener('langchange',()=>{I18N.apply();document.title=I18N.t('library.title');render()});
    (async()=>{try{const response=await fetch(I18N.api('/api/library'),{cache:'no-store'});const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw Error(I18N.t('common.readjson_bad'))}if(!response.ok)throw Error(I18N.mapServer(data.detail||data.error)||I18N.t('library.error_fallback'));state.items=Array.isArray(data)?data:[];$('loading').hidden=true;render()}catch(error){$('loading').hidden=true;$('empty').hidden=false;$('emptyTitle').textContent=I18N.t('library.error_title');$('emptyTitle').className='error';$('emptyText').textContent=I18N.mapServer(error.message)}})();
  </script>
  <script src="/app-nav.js"></script>
</body>
</html>
