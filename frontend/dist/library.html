<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f9eee7">
  <title>素材库 · 慢慢来</title>
  <style>
    :root{--ink:#4c463d;--muted:#948878;--paper:#fffaf2;--pink:#f7e6df;--yellow:#f4cf62;--line:#e6d4c8;--accent:#9a5b48}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#e9e5df;color:var(--ink);font-family:'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}.page{position:relative;isolation:isolate;width:100%;max-width:760px;min-height:100dvh;margin:auto;padding:20px clamp(18px,5vw,42px) 54px;overflow:hidden;background:linear-gradient(180deg,#f7e8e1 0,#fcf7eb 42%,#faf5e7 100%)}.page:before{content:'✧　　♡　　　　✦　　♡\A　　　♡　　　　✧　　　　♡\A ✦　　　　　♡　　　✧';white-space:pre;position:absolute;z-index:-1;inset:86px -20px auto;color:#dcaea044;font-size:34px;line-height:5.8;letter-spacing:18px;transform:rotate(-4deg);pointer-events:none}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.back{display:flex;align-items:center;gap:7px;color:var(--ink);text-decoration:none;border:1px solid #cdbbb0;border-radius:22px;padding:9px 14px;background:#fff8f28f;font-size:13px}.brand{font-size:14px;letter-spacing:2px;color:#a17463}.hero{margin:0 2px 24px}.eyebrow{font-size:11px;letter-spacing:2px;color:#ad7968;margin:0 0 8px}.hero h1{font-family:'STKaiti','KaiTi',serif;font-size:clamp(31px,8vw,46px);font-weight:500;margin:0}.hero p{font-size:12px;line-height:1.8;color:var(--muted);margin:9px 0 0}.search{display:flex;align-items:center;gap:10px;border-bottom:2px solid #7f766c;margin:0 5px 20px;padding:0 4px 8px}.search span{font-size:25px}.search input{width:100%;border:0;outline:0;background:transparent;font-family:'STKaiti','KaiTi',serif;font-size:22px}.search input::placeholder{color:#bca99b}.filters{display:flex;gap:8px;overflow-x:auto;padding:0 2px 16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #d8c5b9;background:#fff9f2;border-radius:22px;padding:9px 14px;min-height:40px}.filter.on{background:#9d5f4c;color:#fff;border-color:#9d5f4c}.summary{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 18px;font-size:12px;color:var(--muted)}.summary strong{color:var(--accent);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}.card{border:0;background:transparent;padding:0;min-width:0;text-align:center;cursor:pointer}.art{position:relative;display:grid;place-items:center;aspect-ratio:1/1;margin-bottom:9px;border-radius:26px;background:#fffaf1b8;border:1px solid #eadbd0;box-shadow:0 12px 30px #7046290b;overflow:hidden}.art:after{content:'';position:absolute;inset:8px;border:1px dashed #d9c4b56b;border-radius:21px}.art img{position:relative;z-index:1;width:88%;height:88%;object-fit:contain;transition:transform .2s}.card:hover .art img{transform:rotate(-2deg) scale(1.035)}.card:focus-visible{outline:2px solid #9d5f4c;outline-offset:6px;border-radius:20px}.title{display:block;font-family:'STKaiti','KaiTi',serif;font-size:18px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{display:block;margin-top:4px;color:var(--muted);font-size:10.5px;line-height:1.5}.progress{display:block;color:#a47754;font-size:10.5px;margin-top:3px}.empty{margin:40px 0;text-align:center;padding:34px 20px;border:1px dashed #d9c5b7;border-radius:24px;background:#fffaf2a6}.empty strong{display:block;font-family:'STKaiti','KaiTi',serif;font-size:23px;margin-bottom:8px}.empty p{color:var(--muted);font-size:12px;line-height:1.8}.empty a{display:inline-block;margin-top:8px;background:var(--yellow);color:var(--ink);text-decoration:none;border-radius:18px;padding:10px 16px;font-size:12px}.error{color:#9b4b3e}.loading{display:grid;place-items:center;min-height:260px;color:var(--muted);font-size:13px}.loading:before{content:'✿';font-size:32px;color:#d4a44d;margin-right:10px}@media(min-width:650px){body{padding:26px 0}.page{min-height:calc(100dvh - 52px);border-radius:30px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><a class="back" href="/">← 回到聊天</a><div class="brand">慢慢来 ✿</div></header>
    <section class="hero">
      <p class="eyebrow">TUTORIAL LIBRARY</p>
      <h1>我的素材库</h1>
      <p>已经按真实画面拆好的教程会留在这里。AI 只按标题和代表截图写出的步骤分类，没有听音频或看完整视频。</p>
    </section>
    <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜教程名…" aria-label="搜索素材"></label>
    <nav class="filters" aria-label="素材分类">
      <button class="filter on" data-category="all">全部</button>
      <button class="filter" data-category="cooking">做饭教程</button>
      <button class="filter" data-category="tools">日常工具</button>
      <button class="filter" data-category="other">其他教程</button>
    </nav>
    <div class="summary"><strong id="filterName">全部素材</strong><span id="count"></span></div>
    <div class="loading" id="loading">正在整理素材…</div>
    <section class="grid" id="grid" aria-live="polite"></section>
    <section class="empty" id="empty" hidden><strong id="emptyTitle">还没有拆好的素材</strong><p id="emptyText">从聊天页找一条教程，完成下载和真实画面分解后，它就会出现在这里。</p><a href="/">去找一个教程 →</a></section>
  </main>
  <script>
    const state={items:[],category:'all',query:''};
    const labels={all:'全部素材',cooking:'做饭教程',tools:'日常工具',other:'其他教程'};
    const icons={cooking:'/assets/library/cooking.png',tools:'/assets/library/tools.png',other:'/assets/library/other.png'};
    const $=id=>document.getElementById(id);
    function iconFor(item){if(/辣子鸡/.test(item.title))return '/assets/library/spicy-chicken.png';if(/洗衣机/.test(item.title))return '/assets/library/washing-machine.png';return icons[item.icon]||icons.other}
    function formatDuration(seconds){if(!seconds&&seconds!==0)return '';const total=Math.max(0,Math.round(seconds));return Math.floor(total/60)+':'+String(total%60).padStart(2,'0')}
    function progressText(item){if(item.step_done>=item.step_total)return '全部 '+item.step_total+' 步都完成了 ✓';if(item.step_done)return '做到 '+item.step_done+' / '+item.step_total+' 步';return '共 '+item.step_total+' 步 · 开始学习'}
    function visibleItems(){const query=state.query.toLocaleLowerCase('zh-CN');return state.items.filter(item=>(state.category==='all'||item.category===state.category)&&(!query||(item.title+' '+(item.uploader||'')+' '+item.category_label).toLocaleLowerCase('zh-CN').includes(query)))}
    function render(){const items=visibleItems();$('filterName').textContent=labels[state.category];$('count').textContent=items.length+' 份';$('grid').replaceChildren(...items.map(item=>{const card=document.createElement('button');card.className='card';card.type='button';card.setAttribute('aria-label',item.display_title+'，'+progressText(item));const art=document.createElement('span');art.className='art';const image=document.createElement('img');image.src=iconFor(item);image.alt='';image.loading='lazy';art.append(image);const title=document.createElement('strong');title.className='title';title.textContent=item.display_title;const meta=document.createElement('span');meta.className='meta';const basis=item.category_basis==='model'?'AI 按截图步骤分类':'标题关键词分类';meta.textContent=[item.category_label,basis,formatDuration(item.duration_seconds)].filter(Boolean).join(' · ');const progress=document.createElement('span');progress.className='progress';progress.textContent=progressText(item);card.append(art,title,meta,progress);card.onclick=()=>location.assign('/steps.html?id='+encodeURIComponent(item.id));return card}));$('empty').hidden=items.length>0;if(!items.length){$('emptyTitle').textContent=state.items.length?'没有符合条件的素材':'还没有拆好的素材';$('emptyText').textContent=state.items.length?'换个关键词或分类看看。':'从聊天页找一条教程，完成下载和真实画面分解后，它就会出现在这里。'}}
    document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{state.category=button.dataset.category;document.querySelectorAll('.filter').forEach(item=>item.classList.toggle('on',item===button));render()}));
    $('search').addEventListener('input',event=>{state.query=event.target.value.trim();render()});
    (async()=>{try{const response=await fetch('/api/library',{cache:'no-store'});const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw Error('服务返回了无法识别的响应')}if(!response.ok)throw Error(data.detail||data.error||'暂时读不到素材库');state.items=Array.isArray(data)?data:[];$('loading').hidden=true;render()}catch(error){$('loading').hidden=true;$('empty').hidden=false;$('emptyTitle').textContent='素材库暂时打不开';$('emptyTitle').className='error';$('emptyText').textContent=error.message}})();
  </script>
</body>
</html>
