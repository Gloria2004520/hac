:#9b937d;margin:0}.suggestions{padding:25px 24px 16px}.suggest-head{display:flex;align-items:center;justify-content:space-between;color:#9a927b;font-size:11px;margin-bottom:10px}.suggest-head button{font-size:11px;min-height:30px;color:#a2956f}.query{display:flex;align-items:center;text-align:left;width:100%;background:#ffffffc9;border:1px solid #efead8;border-radius:17px;padding:13px 14px;margin-bottom:9px;gap:12px;box-shadow:0 3px 7px #64572202}.query:hover{background:#fff}.query .emoji{display:grid;place-items:center;width:35px;height:35px;background:#f8f2de;border-radius:12px;font-size:20px;flex-shrink:0}.query .text{flex:1;font-size:13px;line-height:1.65}.query .arrow{color:#b5ac91;font-size:18px}.little-note{text-align:center;font-size:10px;color:#b2a88f;margin:7px 0 18px;letter-spacing:1px}.bottom{flex-shrink:0;background:linear-gradient(#fcf9eddd,#fcf9ed 18%);padding:8px 18px calc(12px + env(safe-area-inset-bottom));}.attachment{display:flex;align-items:center;gap:8px;background:#f3ebce;border-radius:12px;padding:5px 11px;margin-bottom:8px;font-size:12px}.attachment span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attachment[hidden]{display:none}.attachment button{min-height:28px}.composer{background:white;border-radius:23px;padding:13px 13px 10px;box-shadow:0 4px 24px #88702c09;border:1px solid #eae2c9}.composer textarea{display:block;width:100%;resize:none;min-height:36px;max-height:95px;border:0;background:none;outline:none;padding:3px 4px;color:var(--ink);font-size:14px;line-height:1.7}.composer textarea::placeholder{color:#b4ae9b}.composer-tools{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.tool-group{display:flex;gap:5px}.tool{min-height:34px;background:#f8f6ee;border-radius:12px;padding:5px 10px;font-size:11px;display:flex;align-items:center;gap:5px}.tool svg{width:16px;height:16px}.send{background:var(--yellow);border-radius:50%;width:36px;min-height:36px;font-size:21px;display:grid;place-items:center}.bottom-note{text-align:center;font-size:9px;color:#b5ad99;margin-top:10px}.messages{padding:18px 21px 24px;display:flex;flex-direction:column;gap:20px}.messages:empty{display:none}.message{max-width:92%;font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#f5df91;padding:12px 16px;border-radius:19px 19px 5px 19px}.assistant-wrap{display:flex;gap:9px;align-items:flex-start}.mini{width:29px;height:29px;flex-shrink:0;background:#f8da72;border-radius:11px;display:grid;place-items:center;font-size:18px}.assistant{background:#fffdf7;padding:12px 15px;border:1px solid #eee8d5;border-radius:3px 17px 17px 17px}.message video{display:block;width:100%;max-height:210px;border-radius:10px;margin-top:8px}.chat-caption{text-align:center;font-size:11px;color:#aba087;padding:15px 0 0}.chat-caption[hidden]{display:none}dialog{border:0;border-radius:24px;padding:26px;width:calc(100% - 38px);max-width:396px;color:var(--ink);background:#fffdf6;box-shadow:0 20px 80px #30280b20}dialog::backdrop{background:#39332155;backdrop-filter:blur(3px)}dialog h2{font-size:20px;margin:0 0 13px}dialog p{font-size:13px;color:#9a927d;line-height:1.8}.close{position:absolute;right:12px;top:9px;font-size:22px}.primary{background:var(--yellow);width:100%;border-radius:14px;padding:12px;margin-top:13px;font-weight:600}dialog input[type=url]{width:100%;padding:13px;border:1px solid #e4dcc5;border-radius:12px;margin-top:8px;background:white}.upload-option{display:flex;align-items:center;gap:12px;padding:17px;border-radius:14px;background:#f5f0dd;cursor:pointer;margin-top:17px;font-size:14px}.upload-option input{width:100%;font-size:12px;margin-top:10px}.toast{position:absolute;bottom:170px;left:25px;right:25px;text-align:center;border-radius:12px;background:#4f493e;color:white;padding:12px;font-size:12px;z-index:10}.history-item{width:100%;background:#f4efdd;padding:12px;border-radius:12px;text-align:left;margin-top:10px}.privacy{font-size:11px!i <footer class="bottom"><div class="attachment" id="attachment" hidden><span id="attachmentName"></span><button aria-label="移除视频" onclick="removeFile()">×</button></div><form class="composer" id="form"><textarea id="input" rows="1" aria-label="和小慢说说你想做什么" placeholder="想学什么，或者在哪一步卡住了？"></textarea><div class="composer-tools"><div class="tool-group"><button type="button" class="tool" onclick="openUpload()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 9 5-3v12l-5-3Z"/></svg>上传视频</button><button type="button" class="tool" onclick="openLink()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m10 7 3-3a5 5 0 0 1 7 7l-3 3M14 17l-3 3a5 5 0 0 1-7-7l3-3M8 16l8-8"/></svg>粘贴链接</button></div><button type="submit" id="send" class="send" aria-label="发送消息" disabled>↑</button></div></form><div class="bottom-note">模型接口已配置 · 视频检索与解析尚未接入</div></footer><div class="toast" id="toast" role="status" hidden></div></div><div class="desktop-caption">慢慢来 / MOBILE DEMO<br>手机 App · 小程序交互预览</div><dialog id="modal"><button class="close" aria-label="关闭" onclick="closeModal()">×</button><div id="modalBody"></div></dialog>
<script>
const $=id=>document.getElementById(id);let chatHistory=[],requestBusy=false;let queryPage=0,pendingFile=null,fileURLs=[],lastPrompt='',toastTimer;const queries=[[['🪴','第一次给绿植换盆，要准备些什么？'],['🧵','衣服纽扣掉了，能陪我一起缝好吗？'],['🎬','这个教程太快了，帮我按步骤慢慢做']],[['🧺','白色衣服沾了污渍，我该从哪一步开始？'],['🎨','想画一张生日贺卡，但我完全没有基础'],['🧶','钩针教程看不懂，可以一步步陪我吗？']]];
function drawQueries(){$('queries').replaceChildren(...queries[queryPage].slice(0,1).map(([emoji,text])=>{const b=document.createElement('button');b.className='query';const icon=document.createElement('span');icon.className='emoji';icon.textContent=emoji;const t=document.createElement('span');t.className='text';t.textContent=text;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';b.append(icon,t,arrow);b.onclick=()=>{$('input').value=text;updateInput();send()};return b}))}function swapQueries(){queryPage=1-queryPage;drawQueries()}function updateInput(){$('send').disabled=requestBusy||(!$('input').value.trim()&&!pendingFile);$('input').style.height='auto';$('input').style.height=Math.min($('input').scrollHeight,95)+'px'}$('input').addEventListener('input',updateInput);$('form').addEventListener('submit',e=>{e.preventDefault();send()});$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
function addMessage(text,role,file){const bubble=document.createElement('div');bubble.className='message '+role;bubble.textContent=text;if(file){const video=document.createElement('video');const url=URL.createObjectURL(file);fileURLs.push(url);video.src=url;video.controls=true;video.playsInline=true;video.setAttribute('aria-label','已选择的视频预览');bubble.append(video)}if(role==='assistant'){const wrap=document.createElement('div');wrap.className='assistant-wrap';const face=document.createElement('div');face.className='mini';face.textContent='✿';wrap.append(face,bubble);$('messages').append(wrap)}else $('messages').append(bubble)}
async function send(){if(requestBusy)return;const text=$('input').value.trim();if(!text&&!pendingFile)return;$('welcome').hidden=true;$('chatCaption').hidden=false;lastPrompt=text||'我想跟着这个视频学一学';addMessage(text||'帮我看看这个教程吧','user',pendingFile);const hasFile=!!pendingFile;removeFile();$('input').value='';updateInput();if(hasFile)addMessage('视频已加入对话，可以在这里播放。真实视频解析接口尚未配置，暂时不会根据视频生成步骤。','assistant');else if(/https?:\/\//i.test(text))addMessage('链接已收到。平台检索和视频解析尚未接入，暂时无法读取这段视频。','assistant');else if(chatHistory.length===0&&/绿植|植物|换盆|水培|盆栽|纽扣|缝|贺卡/.test(text))showCategories(text);else await askAgent(text);bottomScroll()}
async function askAgent(text){requestBusy=true;updateInput();const pending=assistantCard();pending.textContent='小慢正在想一想…';pending.setAttribute('role','status');bottomScroll();const next=[...chatHistory,{role:'user',content:text}];try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:next})});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');chatHistory=[...next,{role:'assistant',content:result.message}];pending.replaceChildren();const textNode=el('div',result.message);textNode.style.whiteSpace='pre-wrap';pending.append(textNode);for(const option of result.options||[]){const b=el('button',option,'category');b.onclick=()=>{if(requestBusy)return;$('input').value=option;send()};pending.append(b)}}catch(error){pending.textContent='暂时没能完成回答：'+error.message;const retry=el('button','重新尝试','primary');retry.onclick=()=>{if(requestBusy)return;pending.parentElement.remove();askAgent(text)};pending.append(retry)}finally{requestBusy=false;updateInput();bottomScroll()}}
function bottomScroll(){$('scroll').scrollTop=$('scroll').scrollHeight}
const guides={
sew:{name:'缝纽扣',materials:'两孔纽扣、缝衣针、线、剪刀、需要修补的衣服',steps:[['确认位置','把衣服铺平，参照原来的针孔和相邻纽扣确定位置。','纽扣与扣眼对应，布料平整。','位置不确定时先扣上相邻纽扣比对，暂时不要下针。'],['穿线并打结','剪一段方便操作的线，穿入针眼，将线尾打结。','线尾有结，轻拉不会散开。','线太长容易缠绕，先整理后继续；留意针尖。'],['固定纽扣','从布料背面穿针，在定位处穿过一个纽扣孔，再从另一个孔穿回布料背面，重复固定。','纽扣保持在定位处，线没有打成一团。','不要勒得过紧，给布料与纽扣之间留出扣合需要的空间。'],['收尾并试扣','在布料背面打结固定，剪掉多余线头，轻拉纽扣并试着扣上。','纽扣不松动，能够顺利穿过扣眼。','如果太紧或位置偏移，拆除固定线重新定位，不要强拉。']]},
plant:{name:'绿植换盆',materials:'适合该植物的花盆与基质、垫布、小铲；先确认植物种类',steps:[['确认是否需要换盆','观察植株、根系与原盆情况，并先确认植物品种。不同品种的基质与浇水要求不同。','明确换盆原因，准备了适合品种的基质和带排水孔的盆。','品种或健康状态不明时先确认，不统一推荐浇水量。'],['小心脱盆','铺好垫布，轻扶植株，缓慢松动旧盆，尽量保留完整根团。','植株已脱盆，主要根系没有被强行扯断。','根团卡住时先松动盆壁，不直接拉茎。'],['放入新盆','放入部分基质，摆正根团，再填补周围空隙，避免随意深埋茎部。','植株稳定，种植深度与该植物要求一致。','不要用力压实所有基质，注意排水。'],['安排缓苗','按该品种的要求安排光照和浇水，记录换盆后的变化。','有明确的后续观察计划。','出现异常先核对品种、根系与基质状态，再决定处理方式。']]},
card:{name:'手绘生日贺卡',materials:'卡纸、铅笔、橡皮、彩笔',steps:[['折好卡纸','将卡纸对折，确定封面和内页。','边缘对齐，可以自然开合。','先对齐再压折痕。'],['安排画面','用铅笔轻画标题、主图和祝福语的位置。','文字和主图都有空间。','太拥挤时先减少装饰。'],['描线和上色','先描主体，再少量叠加颜色，等待墨迹干燥。','主体清楚，文字可读。','墨水没干时避免用手擦过。'],['写上祝福','在内页写上祝福和署名，检查拼写。','卡片可以折合，内容完整。','写错时可以用小纸贴覆盖后重新写。']]}}
function selectGuide(text){return /纽扣|缝|衣服/.test(text)?guides.sew:/绿植|换盆|植物/.test(text)?guides.plant:guides.card}
function assistantCard(){const wrap=document.createElement('div');wrap.className='assistant-wrap';const face=document.createElement('div');face.className='mini';face.textContent='✿';const card=document.createElement('div');card.className='assistant message result-card';wrap.append(face,card);$('messages').append(wrap);return card}
function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
const curatedVideos=[{"category":"水培绿植","title":"【彬彬有院】花•060家庭水培绿萝","url":"https://www.youtube.com/watch?v=b_ASbOvx3as","platform":"YouTube","desc":"家庭室内水培绿萝的种植分享。"},{"category":"小盆栽","title":"保姆级月季小苗换盆攻略✔","url":"https://www.bilibili.com/video/BV16s4y1D7xp/","platform":"哔哩哔哩","desc":"月季小苗换盆主题教程，适合查找小型盆栽相关内容。"},{"category":"大盆栽","title":"真是个体力活！大型绿植老桩龟背竹翻盆换土","url":"https://www.bilibili.com/video/BV14U4y1S7Bm/","platform":"哔哩哔哩","desc":"大型龟背竹翻盆过程，涵盖准备、脱盆、根系处理与重新上盆。"}];
function showCategories(text){
 const plant=/绿植|植物|换盆|水培|盆栽/.test(text);if(plant){showRealPlantVideos(text);return}const c=assistantCard();
 c.append(el('strong',plant?'先看看，你想找哪一类绿植教程？':'按你想做的内容，看看这些教程'),el('p','每类下面都有视频条目，点击感兴趣的一条查看介绍和步骤。'),el('div','示例视频目录 · 尚未接入真实检索，视频不可播放','result-note'));

function showModal(html){$('modalBody').innerHTML=html;if(!$('modal').open)$('modal').showModal()}function closeModal(){$('modal').close();$('modalBody').replaceChildren()}$('modal').addEventListener('close',()=>{if(!$('modal').open)$('modalBody').replaceChildren()});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
